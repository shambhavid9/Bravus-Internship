<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
</head>
<body>
    <h1>Admin Portal</h1>
    <p>Welcome, Admin!</p>
    <button onclick="logout()">Logout</button>
    <hr>


<hr>

<h2>System Overview</h2>

<div id="dashboard-stats">

    <div>
        <h3>Total Users</h3>
        <p id="totalUsers">0</p>
    </div>

    <div>
        <h3>Admin Accounts</h3>
        <p id="totalAdmins">0</p>
    </div>

    <div>
        <h3>Management Accounts</h3>
        <p id="totalManagement">0</p>
    </div>

    <div>
        <h3>Total Tasks</h3>
        <p id="totalTasks">0</p>
    </div>

    <div>
        <h3>To Do</h3>
        <p id="todoTasks">0</p>
    </div>

    <div>
        <h3>In Progress</h3>
        <p id="inProgressTasks">0</p>
    </div>

    <div>
        <h3>Completed Tasks</h3>
        <p id="completedTasks">0</p>
    </div>

</div>

<hr>


    <h2>Users</h2>
    <button onclick="loadUsers()">Refresh Users</button>
    <div id="users"></div>
    <hr>

    <h2>All Tasks</h2>
    <button onclick="loadTasks()">Refresh Tasks</button>
    <div id="tasks"></div>
    
</body>

<script src="admin.js"></script>

</html>
