
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Portal</title>

    <style>
        
body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f4f6f9;
    color: #222;
}

input, textarea, select, button {
    padding: 10px;
    margin: 6px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    cursor: pointer;
    background: #222;
    color: white;
    border: none;
}

button:hover {
    background: #444;
}

.dashboard {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px 0;
}

.card {
    background: white;
    padding: 20px;
    min-width: 130px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

.card h3 {
    margin-top: 0;
}

.filters {
    background: white;
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
}

.board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0 15px;
}

.board {
    display: grid;
    grid-template-columns: repeat(4, minmax(220px, 1fr));
    gap: 15px;
    align-items: start;
    overflow-x: auto;
}

.board-column {
    background: #e9edf3;
    padding: 15px;
    border-radius: 10px;
    min-height: 250px;
}

.board-column h3 {
    margin-top: 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #ccc;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.task-card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.task-card h4 {
    margin-top: 0;
}

.task-card button {
    margin-right: 6px;
}

@media (max-width: 900px) {
    .board {
        grid-template-columns: repeat(4, 250px);
    }
}

    </style>
</head>

<body>

    <h1>Management Portal</h1>
    <p>Welcome, Management!</p>

    <button onclick="logout()">Logout</button>

    <hr>

    <h2>Task Dashboard</h2>

    <div class="dashboard">

        <div class="card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="card">
            <h3>To Do</h3>
            <p id="todoTasks">0</p>
        </div>

        <div class="card">
            <h3>In Progress</h3>
            <p id="inProgressTasks">0</p>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

        <div class="card">
            <h3>Overdue</h3>
            <p id="overdueTasks">0</p>
        </div>

    </div>

    <hr>

    <h2>Create Task</h2>

    <form id="taskForm">

        <input
            type="text"
            id="title"
            placeholder="Task title"
            required
        >

        <br>

        <textarea
            id="description"
            placeholder="Task description"
            required
        ></textarea>

        <br>

        <select id="assignedTo" required>
            <option value="">Loading users...</option>
        </select>

        <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
        </select>

        <br>

        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate">

        <br>

        <button type="submit">Create Task</button>

    </form>

    <p id="message"></p>

    <hr>

    <h2>Tasks</h2>

    <div class="filters">

        <h3>Filter Tasks</h3>

        <select id="filterAssignee">
            <option value="">All Users</option>
        </select>

        <select id="filterStatus">
            <option value="">All Statuses</option>
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="In Review">In Review</option>
            <option value="Done">Done</option>
        </select>

        <select id="filterPriority">
            <option value="">All Priorities</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <button type="button" id="clearFilters">Clear Filters</button>

    </div>

    <div class="board-header">
    <h2>Task Tracking Board</h2>
    <button onclick="loadTasks()">Refresh Tasks</button>
</div>

<div class="board" id="taskBoard">

    <div class="board-column">
        <h3>To Do</h3>
        <div id="todoColumn" class="task-list"></div>
    </div>

    <div class="board-column">
        <h3>In Progress</h3>
        <div id="inProgressColumn" class="task-list"></div>
    </div>

    <div class="board-column">
        <h3>In Review</h3>
        <div id="inReviewColumn" class="task-list"></div>
    </div>

    <div class="board-column">
        <h3>Done</h3>
        <div id="doneColumn" class="task-list"></div>
    </div>

</div>

    <script src="management.js"></script>

</body>
</html>
